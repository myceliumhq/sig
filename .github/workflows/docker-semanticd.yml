name: Docker Publish (semanticd)

# Triggered by the Release workflow COMPLETING, not by the tag it pushes --
# semantic-release pushes its release tag using this job's own GITHUB_TOKEN,
# and GitHub never lets a GITHUB_TOKEN-authored push trigger another
# `on: push` workflow (anti-recursion guard). workflow_run has no such
# restriction, but also carries no tag of its own, so check-tag resolves
# "did main just get a new tag at its current tip" itself (checking out
# `main` directly, not github.event.workflow_run.head_sha -- see that
# step's own comment) and skips the whole thing if not (a release run that
# found nothing to release still completes successfully as a no-op).

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

jobs:
  check-tag:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      # Deliberately NOT github.event.workflow_run.head_sha -- live-confirmed
      # that field is pinned to the commit that TRIGGERED the Release run,
      # not whatever the release job itself later pushed (its own
      # @semantic-release/git commit, created mid-run). By the time this
      # workflow_run fires, that commit -- and the tag pointing at it -- is
      # already on `main`, so checking out the branch directly is what
      # actually finds the version tag; head_sha never will.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - id: tag
        run: echo "tag=$(git tag --points-at HEAD | head -n1)" >> "$GITHUB_OUTPUT"

  publish:
    needs: check-tag
    if: needs.check-tag.outputs.tag != ''
    permissions:
      contents: read
      packages: write
    uses: myceliumhq/.github/.github/workflows/docker-publish.yml@main
    with:
      image: sig-semanticd
      dockerfile: Dockerfile.semanticd
      tag: ${{ needs.check-tag.outputs.tag }}
      ref: ${{ needs.check-tag.outputs.tag }}
